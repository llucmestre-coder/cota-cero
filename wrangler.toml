# Cloudflare Pages (connectat a GitHub). Web estàtica a l'arrel + Functions a /functions.
# Secrets (NO aquí: el repo és públic) — `wrangler pages secret put <NOM> --project-name cota-cero`:
#   TURNSTILE_SECRET, BREVO_API_KEY, BREVO_SENDER, WHATSAPP
name = "cota-cero"
pages_build_output_dir = "."
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "CODIS"
id = "994bf9fd07044d80969c39e4d4ee2237"

# Contactes de la calculadora (seguiment). Esquema: schema.sql. Llista privada a /admin.
[[d1_databases]]
binding = "LEADS"
database_name = "cota-cero-leads"
database_id = "f7ea7cca-034c-4efc-8cff-7fdbdcc1e09f"
